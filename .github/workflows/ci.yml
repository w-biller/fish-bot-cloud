name: ci

on:
  schedule:
    - cron: '10 16 * * *'
    - cron: '10 21 * * *'
    - cron: '10 2 * * *'
    - cron: '10 7 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: '-'
        required: false
        default: '240'
      debug:
        description: '-'
        required: false
        default: '0'

permissions:
  contents: read
  issues: write

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    env:
      TZ: Asia/Shanghai
      MAX_MINUTES: ${{ github.event.inputs.minutes || '240' }}
      PAGE_LOG: ${{ github.event.inputs.debug || '0' }}
      FISH_REPO: ${{ github.repository }}
      FISH_BOT_KEY: ${{ secrets.FISH_BOT_KEY }}
      FISH_STATE_ENC: ${{ secrets.FISH_STATE_ENC }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-v1

      - name: state
        uses: actions/cache/restore@v4
        with:
          path: cloud/out/state.enc
          key: fish-state-${{ github.run_id }}
          restore-keys: |
            fish-state-

      - name: deps
        working-directory: cloud
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --with-deps

      - name: run
        working-directory: cloud
        run: node runner.mjs

      - name: save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cloud/out/state.enc
          key: fish-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: summary
        if: always()
        run: |
          if [ -f cloud/out/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat cloud/out/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s
          path: cloud/out/summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: alert
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "run failed $(date '+%Y-%m-%d %H:%M')" --body "$RUN_URL" || true
